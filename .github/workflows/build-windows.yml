
name: Build Windows Application

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python --version
          python -m pip show Flask PyInstaller

      - name: Verify application files
        shell: pwsh
        run: |
          if (!(Test-Path "desktop.py")) {
            throw "desktop.py was not found."
          }

          if (!(Test-Path "ChadCivilRegistry.spec")) {
            throw "PyInstaller spec file was not found."
          }

          if (!(Test-Path "app/static/images/chad-civil-registry.ico")) {
            throw "Application icon was not found."
          }

      - name: Build Windows application
        run: |
          python -m PyInstaller --noconfirm --clean ChadCivilRegistry.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ChadCivilRegistry/ChadCivilRegistry.exe")) {
            throw "Build failed: executable was not found."
          }

      - name: Package Windows application
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/ChadCivilRegistry/*" `
            -DestinationPath "dist/ChadCivilRegistry-Windows.zip" `
            -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ChadCivilRegistry-Windows
          path: dist/ChadCivilRegistry-Windows.zip
          if-no-files-found: error
